<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyProject — Project Management</title>
  <style>
    :root {
      --bg: #0f1729;
      --panel: #1a2337;
      --panel-2: #222d45;
      --border: #2e3a55;
      --text: #e5eaf4;
      --muted: #8b98b4;
      --accent: #5b8def;
      --accent-hover: #4a7ce0;
      --danger: #e05b6f;
      --ok: #4caf7d;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; margin: 0; }
    header .user-box { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 14px; font-size: 15px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 9px 16px;
      border: none;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-hover); }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    button.ghost:hover { background: var(--panel-2); color: var(--text); }
    button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; font-size: 12px; }
    button.danger:hover { background: var(--danger); color: #fff; }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row > * { flex: 1; }
    .row button { flex: 0 0 auto; }
    ul.list { list-style: none; padding: 0; margin: 0; }
    ul.list li {
      padding: 12px 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    ul.list li.clickable { cursor: pointer; }
    ul.list li.clickable:hover { border-color: var(--accent); }
    ul.list li.active { border-color: var(--accent); background: #26324e; }
    .item-title { font-weight: 600; }
    .item-sub { font-size: 12px; color: var(--muted); }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--border);
      color: var(--text);
      white-space: nowrap;
    }
    .hidden { display: none; }
    .msg { font-size: 13px; padding: 8px 12px; border-radius: 7px; margin-top: 10px; }
    .msg.err { background: rgba(224,91,111,.15); color: var(--danger); }
    .msg.ok { background: rgba(76,175,125,.15); color: var(--ok); }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .config { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .config input { width: 220px; padding: 5px 8px; font-size: 12px; }
    textarea { resize: vertical; min-height: 60px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { background: var(--panel-2); color: var(--muted); }
    .tabs button.active { background: var(--accent); color: #fff; }
    .task-images {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .task-images h3 { margin: 0 0 10px; font-size: 14px; }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .image-card {
      overflow: hidden;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .image-card img {
      display: block;
      width: 100%;
      height: 130px;
      object-fit: cover;
      background: #0b1020;
    }
    .image-info { padding: 9px; }
    .image-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .image-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .task-comments {
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .comment-list {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }
    .comment-card {
      padding: 11px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .comment-content {
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .notification-container {
      position: fixed;
      top: 76px;
      right: 20px;
      z-index: 100;
      display: grid;
      width: min(360px, calc(100vw - 40px));
      gap: 10px;
    }
    .notification-toast {
      padding: 14px 16px;
      background: var(--panel-2);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .3);
    }
    .notification-toast strong {
      display: block;
      margin-bottom: 4px;
    }
    .notification-toast span {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>📋 MyProject</h1>
    <div class="user-box">
      <div class="config">
        API: <input id="apiBase" value="http://localhost:8000">
      </div>
      <span id="whoami" class="badge hidden"></span>
      <button id="logoutBtn" class="ghost hidden" onclick="logout()">Log out</button>
    </div>
  </header>

  <div
    id="notificationContainer"
    class="notification-container"
    aria-live="polite"
  ></div>

  <div class="container">
    <!-- AUTH -->
    <div id="authView">
      <div class="grid">
        <div class="card">
          <h2>Sign up</h2>
          <label>Username (3-25)</label>
          <input id="regUser" autocomplete="username">
          <label>Password (5-100)</label>
          <input id="regPass" type="password" autocomplete="new-password">
          <br><br>
          <button onclick="register()">Sign up</button>
          <div id="regMsg"></div>
        </div>
        <div class="card">
          <h2>Log in</h2>
          <label>Username</label>
          <input id="logUser" autocomplete="username">
          <label>Password</label>
          <input id="logPass" type="password" autocomplete="current-password">
          <br><br>
          <button onclick="login()">Log in</button>
          <div id="logMsg"></div>
        </div>
      </div>
    </div>

    <!-- APP -->
    <div id="appView" class="hidden">
      <div class="grid">
        <div>
          <div class="card">
            <h2>New project</h2>
            <label>Title</label>
            <input id="projTitle">
            <label>Description</label>
            <textarea id="projDesc"></textarea>
            <br><br>
            <button onclick="createProject()">Create project</button>
            <div id="projMsg"></div>
          </div>
          <div class="card">
            <h2>Projects</h2>
            <ul id="projectList" class="list"></ul>
          </div>
        </div>

        <div>
          <div id="projDetail" class="card hidden">
            <h2 id="detailTitle">Project details</h2>
            <div class="tabs">
              <button id="tabTasks" class="active" onclick="switchTab('tasks')">Tasks</button>
              <button id="tabMembers" onclick="switchTab('members')">Members</button>
            </div>

            <!-- Tasks tab -->
            <div id="tasksPane">
              <div id="taskCreationPanel">
                <label>Task title</label>
                <input id="taskTitle">
                <label>Description</label>
                <input id="taskDesc">
                <label>Assign to</label>
                <select id="taskAssignee">
                  <option value="">Leave unassigned</option>
                </select>
                <br><br>
                <button onclick="createTask()">Add task</button>
                <div id="taskMsg"></div>
                <br>
              </div>
              <ul id="taskList" class="list"></ul>

              <div id="taskImagesPanel" class="task-images hidden">
                <h3 id="taskImagesTitle">Task discussion</h3>

                <div class="task-comments">
                  <label>Write a comment about this task</label>
                  <textarea
                    id="taskCommentContent"
                    maxlength="2000"
                    placeholder="Describe a bug, add context, or leave an update..."
                  ></textarea>
                  <br>
                  <button onclick="postTaskComment()">Post comment</button>
                  <div id="taskCommentMsg"></div>
                  <div id="taskCommentList" class="comment-list"></div>
                </div>

                <h3>Task images</h3>
                <label>JPEG, PNG or WebP (maximum 5 MB)</label>
                <div class="row">
                  <input
                    id="taskImageFile"
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                  >
                  <button onclick="uploadTaskImage()">Upload</button>
                </div>
                <div id="taskImageMsg"></div>
                <div id="taskImageList" class="image-grid"></div>
              </div>
            </div>

            <!-- Members tab -->
            <div id="membersPane" class="hidden">
              <div class="row">
                <div>
                  <label>User ID</label>
                  <input id="memberId" type="number">
                </div>
                <button onclick="addMember()">Add member</button>
              </div>
              <div id="memberMsg"></div>
              <br>
              <ul id="memberList" class="list"></ul>
            </div>
          </div>

          <div class="card">
            <h2>My tasks</h2>
            <ul id="myTaskList" class="list"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = null;
    let username = null;
    let currentUserId = null;
    let currentProject = null;
    let currentTask = null;
    let projectTasks = new Map();
    let imageObjectUrls = [];
    let notificationSocket = null;
    let notificationReconnectTimer = null;
    let notificationHeartbeatTimer = null;
    let notificationReconnectAttempts = 0;
    let notificationGeneration = 0;

    const $ = id => document.getElementById(id);
    const apiBase = () => $('apiBase').value.replace(/\/$/, '');

    function msg(el, text, ok = false) {
      $(el).innerHTML = text ? `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>` : '';
    }

    async function api(path, { method = 'GET', body = null, auth = false } = {}) {
      const isFormData = body instanceof FormData;
      const headers = {};
      if (body !== null && !isFormData) headers['Content-Type'] = 'application/json';
      if (auth && token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(apiBase() + path, {
        method,
        headers,
        body: body === null ? null : (isFormData ? body : JSON.stringify(body)),
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data.detail;
        const text = Array.isArray(detail)
          ? detail.map(d => `${(d.loc || []).join('.')}: ${d.msg}`).join('; ')
          : (detail || JSON.stringify(data));
        throw new Error(text);
      }
      return data;
    }

    // ---- Real-time notifications ----
    function notificationWebSocketUrl() {
      const url = new URL(apiBase());
      url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      url.pathname = `${url.pathname.replace(/\/$/, '')}/ws/notifications`;
      url.search = '';
      url.hash = '';
      return url.toString();
    }

    function connectNotifications() {
      if (!token) return;

      const connectionToken = token;
      const generation = ++notificationGeneration;
      clearTimeout(notificationReconnectTimer);

      const socket = new WebSocket(notificationWebSocketUrl());
      notificationSocket = socket;

      socket.onopen = () => {
        socket.send(JSON.stringify({
          type: 'authenticate',
          token: connectionToken,
        }));
      };

      socket.onmessage = event => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.type === 'connection.ready') {
          notificationReconnectAttempts = 0;
          clearInterval(notificationHeartbeatTimer);
          notificationHeartbeatTimer = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ type: 'ping' }));
            }
          }, 25000);
          return;
        }

        if (message.type === 'notification.created') {
          displayNotification(message.data);
        }
      };

      socket.onclose = event => {
        if (notificationSocket === socket) {
          notificationSocket = null;
        }
        clearInterval(notificationHeartbeatTimer);

        const isCurrentConnection = generation === notificationGeneration;
        const isCurrentSession = token && token === connectionToken;
        if (!isCurrentConnection || !isCurrentSession) return;

        if (event.code === 1008) {
          displayNotification({
            title: 'Notification connection rejected',
            message: event.reason || 'Log in again to reconnect.',
          });
          return;
        }

        const delay = Math.min(
          1000 * 2 ** notificationReconnectAttempts,
          30000,
        );
        notificationReconnectAttempts += 1;
        notificationReconnectTimer = setTimeout(connectNotifications, delay);
      };

      socket.onerror = () => {
        console.error('Notification WebSocket connection failed.');
      };
    }

    function disconnectNotifications() {
      notificationGeneration += 1;
      notificationReconnectAttempts = 0;
      clearTimeout(notificationReconnectTimer);
      clearInterval(notificationHeartbeatTimer);

      if (notificationSocket) {
        notificationSocket.close(1000, 'User logged out');
        notificationSocket = null;
      }
    }

    function displayNotification(notification) {
      const toast = document.createElement('div');
      toast.className = 'notification-toast';

      const title = document.createElement('strong');
      title.textContent = notification?.title || 'New notification';

      const message = document.createElement('span');
      message.textContent = notification?.message || '';

      toast.append(title, message);
      $('notificationContainer').prepend(toast);
      setTimeout(() => toast.remove(), 8000);
    }

    // ---- Auth ----
    async function register() {
      msg('regMsg', '');
      try {
        const u = await api('/users/register', {
          method: 'POST',
          body: { username: $('regUser').value, password: $('regPass').value },
        });
        msg('regMsg', `Registered user "${u.username}" (ID ${u.id}). You can now log in.`, true);
      } catch (e) { msg('regMsg', e.message); }
    }

    async function login() {
      msg('logMsg', '');
      try {
        const data = await api('/users/login', {
          method: 'POST',
          body: { username: $('logUser').value, password: $('logPass').value },
        });
        token = data.access_token;
        username = data.username;
        currentUserId = data.user_id;
        onLoggedIn();
      } catch (e) { msg('logMsg', e.message); }
    }

    function onLoggedIn() {
      $('authView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      $('whoami').classList.remove('hidden');
      $('logoutBtn').classList.remove('hidden');
      $('whoami').textContent = '👤 ' + username;
      connectNotifications();
      loadProjects();
      loadMyTasks();
    }

    function logout() {
      clearImageObjectUrls();
      disconnectNotifications();
      token = null; username = null; currentUserId = null;
      currentProject = null; currentTask = null;
      projectTasks = new Map();
      $('authView').classList.remove('hidden');
      $('appView').classList.add('hidden');
      $('whoami').classList.add('hidden');
      $('logoutBtn').classList.add('hidden');
    }

    // ---- Projects ----
    async function loadProjects() {
      try {
        const projects = await api('/projects', { auth: true });
        const ul = $('projectList');
        ul.innerHTML = '';
        if (!projects.length) {
          ul.innerHTML = '<div class="empty">You are not a member of any projects yet.</div>';
          return;
        }
        projects.forEach(p => {
          const li = document.createElement('li');
          li.className = 'clickable' + (currentProject === p.id ? ' active' : '');
          li.onclick = () => openProject(p);
          li.innerHTML = `<div>
              <div class="item-title">${escapeHtml(p.title)}</div>
              <div class="item-sub">${escapeHtml(p.description || '')}</div>
            </div><span class="badge">#${p.id}</span>`;
          ul.appendChild(li);
        });
      } catch (e) { $('projectList').innerHTML = `<div class="msg err">${e.message}</div>`; }
    }

    async function createProject() {
      msg('projMsg', '');
      try {
        await api('/projects', {
          method: 'POST', auth: true,
          body: { title: $('projTitle').value, description: $('projDesc').value || null },
        });
        $('projTitle').value = ''; $('projDesc').value = '';
        msg('projMsg', 'Project created.', true);
        loadProjects();
      } catch (e) { msg('projMsg', e.message); }
    }

    function openProject(p) {
      closeTaskImages();
      currentProject = p.id;
      $('projDetail').classList.remove('hidden');
      $('taskCreationPanel').classList.toggle(
        'hidden',
        p.owner_id !== currentUserId,
      );
      $('detailTitle').textContent = `${p.title} (#${p.id})`;
      loadProjects();
      switchTab('tasks');
      loadTasks();
      loadMembers();
    }

    function switchTab(tab) {
      const isTasks = tab === 'tasks';
      $('tabTasks').classList.toggle('active', isTasks);
      $('tabMembers').classList.toggle('active', !isTasks);
      $('tasksPane').classList.toggle('hidden', !isTasks);
      $('membersPane').classList.toggle('hidden', isTasks);
    }

    // ---- Tasks ----
    async function loadTasks() {
      try {
        const tasks = await api(`/projects/${currentProject}/tasks`, { auth: true });
        renderTasks($('taskList'), tasks);
      } catch (e) { $('taskList').innerHTML = `<div class="msg err">${e.message}</div>`; }
    }

    async function createTask() {
      msg('taskMsg', '');
      try {
        const selectedAssignee = $('taskAssignee').value;
        await api(`/projects/${currentProject}/tasks`, {
          method: 'POST', auth: true,
          body: {
            title: $('taskTitle').value,
            description: $('taskDesc').value,
            user_id: selectedAssignee ? Number(selectedAssignee) : null,
          },
        });
        $('taskTitle').value = ''; $('taskDesc').value = '';
        $('taskAssignee').value = '';
        msg('taskMsg', 'Task added.', true);
        loadTasks();
        loadMyTasks();
      } catch (e) { msg('taskMsg', e.message); }
    }

    async function loadMyTasks() {
      try {
        const tasks = await api('/users/me/tasks', { auth: true });
        renderTasks($('myTaskList'), tasks, true);
      } catch (e) { $('myTaskList').innerHTML = `<div class="msg err">${e.message}</div>`; }
    }

    function renderTasks(ul, tasks, showProject = false) {
      ul.innerHTML = '';
      if (!tasks.length) { ul.innerHTML = '<div class="empty">No tasks.</div>'; return; }
      if (!showProject) projectTasks = new Map(tasks.map(task => [task.id, task]));
      tasks.forEach(t => {
        const li = document.createElement('li');
        const assignment = t.assigned_username
          ? `Assigned to ${escapeHtml(t.assigned_username)}`
          : 'Not assigned';
        const claimButton = t.user_id === null
          ? `<button onclick="claimTask(event, ${t.project_id}, ${t.id})">Claim task</button>`
          : '';
        li.innerHTML = `<div>
            <div class="item-title">${escapeHtml(t.title)}</div>
            <div class="item-sub">${escapeHtml(t.description || '')}${showProject ? ' · project #' + t.project_id : ''}</div>
            <div class="item-sub">${assignment}</div>
          </div><div>
            <span class="badge">${escapeHtml(t.status)}</span>
            ${claimButton}
            ${showProject ? '' : `<button class="ghost" onclick="openTaskImages(${t.id})">Discussion</button>`}
          </div>`;
        ul.appendChild(li);
      });
    }

    async function claimTask(event, projectId, taskId) {
      event.stopPropagation();
      msg('taskMsg', '');

      if (!Number.isInteger(projectId) || !Number.isInteger(taskId)) {
        msg('taskMsg', 'Could not identify this task. Refresh the page and try again.');
        return;
      }

      try {
        const claimedTask = await api(
          `/projects/${projectId}/tasks/${taskId}/claim`,
          { method: 'PATCH', auth: true },
        );
        msg(
          'taskMsg',
          `Task assigned to ${claimedTask.assigned_username}.`,
          true,
        );
        const refreshes = [loadMyTasks()];
        if (currentProject === projectId) {
          refreshes.push(loadTasks());
        }
        await Promise.all(refreshes);
      } catch (e) {
        msg('taskMsg', e.message);
        if (currentProject === projectId) {
          await loadTasks();
        }
      }
    }

    // ---- Task images ----
    function clearImageObjectUrls() {
      imageObjectUrls.forEach(url => URL.revokeObjectURL(url));
      imageObjectUrls = [];
    }

    function closeTaskImages() {
      clearImageObjectUrls();
      currentTask = null;
      projectTasks = new Map();
      $('taskImagesPanel').classList.add('hidden');
      $('taskImageList').innerHTML = '';
      $('taskImageFile').value = '';
      $('taskCommentContent').value = '';
      $('taskCommentList').innerHTML = '';
      msg('taskImageMsg', '');
      msg('taskCommentMsg', '');
    }

    function openTaskImages(taskId) {
      const task = projectTasks.get(taskId);
      if (!task) return;

      currentTask = taskId;
      $('taskImagesPanel').classList.remove('hidden');
      $('taskImagesTitle').textContent = `Discussion for ${task.title} (#${task.id})`;
      $('taskImageFile').value = '';
      $('taskCommentContent').value = '';
      msg('taskImageMsg', '');
      msg('taskCommentMsg', '');
      loadTaskImages();
      loadTaskComments();
    }

    // ---- Task comments ----
    async function postTaskComment() {
      msg('taskCommentMsg', '');
      const content = $('taskCommentContent').value.trim();

      if (!currentTask) {
        msg('taskCommentMsg', 'Select a task first.');
        return;
      }
      if (!content) {
        msg('taskCommentMsg', 'Comment cannot be empty.');
        return;
      }

      try {
        await api(`/projects/${currentProject}/tasks/${currentTask}/comments`, {
          method: 'POST',
          body: { content },
          auth: true,
        });
        $('taskCommentContent').value = '';
        msg('taskCommentMsg', 'Comment posted.', true);
        loadTaskComments();
      } catch (e) { msg('taskCommentMsg', e.message); }
    }

    async function loadTaskComments() {
      if (!currentTask) return;

      const container = $('taskCommentList');
      container.innerHTML = '<div class="empty">Loading comments...</div>';

      try {
        const comments = await api(
          `/projects/${currentProject}/tasks/${currentTask}/comments`,
          { auth: true },
        );

        container.innerHTML = '';
        if (!comments.length) {
          container.innerHTML = '<div class="empty">No comments for this task.</div>';
          return;
        }

        comments.forEach(comment => {
          const card = document.createElement('div');
          card.className = 'comment-card';
          const createdAt = comment.created_at
            ? new Date(comment.created_at).toLocaleString('en-US')
            : '';
          card.innerHTML = `<div class="comment-header">
              <div class="item-sub">User #${comment.author_id} · ${escapeHtml(createdAt)}</div>
              <button class="danger" onclick="deleteTaskComment(${comment.id})">Delete</button>
            </div>
            <div class="comment-content">${escapeHtml(comment.content)}</div>`;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<div class="msg err">${escapeHtml(e.message)}</div>`;
      }
    }

    async function deleteTaskComment(commentId) {
      msg('taskCommentMsg', '');
      try {
        await api(
          `/projects/${currentProject}/tasks/${currentTask}/comments/${commentId}`,
          { method: 'DELETE', auth: true },
        );
        msg('taskCommentMsg', 'Comment deleted.', true);
        loadTaskComments();
      } catch (e) { msg('taskCommentMsg', e.message); }
    }

    async function uploadTaskImage() {
      msg('taskImageMsg', '');
      const file = $('taskImageFile').files[0];

      if (!currentTask) {
        msg('taskImageMsg', 'Select a task first.');
        return;
      }
      if (!file) {
        msg('taskImageMsg', 'Choose an image first.');
        return;
      }
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        msg('taskImageMsg', 'Only JPEG, PNG and WebP images are allowed.');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        msg('taskImageMsg', 'Image cannot exceed 5 MB.');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        await api(`/projects/${currentProject}/tasks/${currentTask}/images`, {
          method: 'POST',
          body: formData,
          auth: true,
        });
        $('taskImageFile').value = '';
        msg('taskImageMsg', 'Image uploaded.', true);
        loadTaskImages();
      } catch (e) { msg('taskImageMsg', e.message); }
    }

    async function fetchImageContent(imageId) {
      const response = await fetch(
        `${apiBase()}/projects/${currentProject}/tasks/${currentTask}/images/${imageId}/content`,
        { headers: { Authorization: 'Bearer ' + token } },
      );

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || 'Could not load image content.');
      }

      const objectUrl = URL.createObjectURL(await response.blob());
      imageObjectUrls.push(objectUrl);
      return objectUrl;
    }

    async function loadTaskImages() {
      if (!currentTask) return;

      clearImageObjectUrls();
      const container = $('taskImageList');
      container.innerHTML = '<div class="empty">Loading images...</div>';

      try {
        const images = await api(
          `/projects/${currentProject}/tasks/${currentTask}/images`,
          { auth: true },
        );

        container.innerHTML = '';
        if (!images.length) {
          container.innerHTML = '<div class="empty">No images for this task.</div>';
          return;
        }

        for (const image of images) {
          const objectUrl = await fetchImageContent(image.id);
          const card = document.createElement('div');
          card.className = 'image-card';
          card.innerHTML = `<img src="${objectUrl}" alt="${escapeHtml(image.original_filename)}">
            <div class="image-info">
              <div class="image-name" title="${escapeHtml(image.original_filename)}">${escapeHtml(image.original_filename)}</div>
              <div class="item-sub">${formatBytes(image.size_bytes)} · user #${image.uploader_id}</div>
              <div class="image-actions">
                <a href="${objectUrl}" target="_blank" rel="noopener">Open</a>
                <button class="danger" onclick="deleteTaskImage(${image.id})">Delete</button>
              </div>
            </div>`;
          container.appendChild(card);
        }
      } catch (e) {
        clearImageObjectUrls();
        container.innerHTML = `<div class="msg err">${escapeHtml(e.message)}</div>`;
      }
    }

    async function deleteTaskImage(imageId) {
      msg('taskImageMsg', '');
      try {
        await api(
          `/projects/${currentProject}/tasks/${currentTask}/images/${imageId}`,
          { method: 'DELETE', auth: true },
        );
        msg('taskImageMsg', 'Image deleted.', true);
        loadTaskImages();
      } catch (e) { msg('taskImageMsg', e.message); }
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    // ---- Members ----
    function populateTaskAssignees(members) {
      const select = $('taskAssignee');
      const previousValue = select.value;
      select.innerHTML = '';

      const unassignedOption = document.createElement('option');
      unassignedOption.value = '';
      unassignedOption.textContent = 'Leave unassigned';
      select.appendChild(unassignedOption);

      members.forEach(member => {
        const option = document.createElement('option');
        option.value = String(member.user_id);
        option.textContent = `${member.username} (#${member.user_id})`;
        select.appendChild(option);
      });

      if ([...select.options].some(option => option.value === previousValue)) {
        select.value = previousValue;
      }
    }

    async function loadMembers() {
      try {
        const members = await api(`/projects/${currentProject}/members`, { auth: true });
        populateTaskAssignees(members);
        const ul = $('memberList');
        ul.innerHTML = '';
        if (!members.length) { ul.innerHTML = '<div class="empty">No members.</div>'; return; }
        members.forEach(m => {
          const li = document.createElement('li');
          li.innerHTML = `<div>
              <div class="item-title">${escapeHtml(m.username)}</div>
              <div class="item-sub">User #${m.user_id}</div>
              <div class="item-sub">${m.joined_at ? new Date(m.joined_at).toLocaleString('en-US') : ''}</div>
            </div><button class="danger" onclick="removeMember(${m.user_id})">Remove</button>`;
          ul.appendChild(li);
        });
      } catch (e) { $('memberList').innerHTML = `<div class="msg err">${e.message}</div>`; }
    }

    async function addMember() {
      msg('memberMsg', '');
      try {
        await api(`/projects/${currentProject}/members`, {
          method: 'POST', auth: true,
          body: { user_id: parseInt($('memberId').value, 10) },
        });
        $('memberId').value = '';
        msg('memberMsg', 'Member added.', true);
        loadMembers();
      } catch (e) { msg('memberMsg', e.message); }
    }

    async function removeMember(userId) {
      try {
        await api(`/projects/${currentProject}/members/${userId}`, { method: 'DELETE', auth: true });
        loadMembers();
      } catch (e) { msg('memberMsg', e.message); }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
