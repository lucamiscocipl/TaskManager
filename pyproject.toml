requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]
