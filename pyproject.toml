[project]
name = "task-manager-api"
version = "0.1.0"
description = "Task manager API built with FastAPI and PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "websockets>=16.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.21",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]
